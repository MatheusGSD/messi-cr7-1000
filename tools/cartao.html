<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cartão para o X</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Barlow:wght@400;500;600;700&family=Doto:wght@900&display=swap">
<style>
/* Cartão 1600 × 900 para o X, com o tema escuro da página. O tools/imagem_x.py fotografa esta página com o Chrome. */
:root {
  --bg: #0b111c; --surface: #111a2a; --line: #24324d; --grid: #1c2840; --fg: #e9eef6; --muted: #8f9cb4;
  --messi: #4b98e0; --cr7: #ef4f4c; --messi-led: #82c3f6; --cr7-led: #ff6d68; --gold: #e0b84e;
  --font-display: "Big Shoulders Display", "Arial Narrow", sans-serif;
  --font-body: "Barlow", "Segoe UI", sans-serif;
  --font-led: "Doto", "Courier New", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1600px; height: 900px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: var(--font-body); }
.card { position: relative; width: 1600px; height: 900px; padding: 56px 72px 48px; display: flex; flex-direction: column; }
.card::before {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 520px; pointer-events: none;
  background:
    radial-gradient(ellipse 34% 70% at 10% 0%, color-mix(in srgb, var(--messi) 20%, transparent), transparent 70%),
    radial-gradient(ellipse 34% 70% at 90% 0%, color-mix(in srgb, var(--cr7) 18%, transparent), transparent 70%);
}
.card > * { position: relative; }
.eyebrow { font: 600 22px/1 var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
h1 { font: 900 96px/.9 var(--font-display); text-transform: uppercase; margin: 14px 0 0; }
h1 .k { color: var(--gold); }
.board { margin-top: 34px; display: grid; grid-template-columns: 1fr auto auto auto 1fr; align-items: center; gap: 22px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 22px 36px; }
.who { font: 800 44px/1 var(--font-display); text-transform: uppercase; display: flex; align-items: center; gap: 14px; white-space: nowrap; }
.who.r { justify-content: flex-end; }
.sq { width: 20px; height: 20px; border-radius: 4px; }
.need { font: 500 26px/1.2 var(--font-body); color: var(--muted); margin-top: 10px; }
.need b { color: var(--fg); }
.r .need, .need.r { text-align: right; }
.led { font: 900 112px/1 var(--font-led); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.led.m { color: var(--messi-led); text-shadow: 0 0 30px color-mix(in srgb, var(--messi-led) 45%, transparent); }
.led.c { color: var(--cr7-led); text-shadow: 0 0 30px color-mix(in srgb, var(--cr7-led) 45%, transparent); }
.goal { text-align: center; color: var(--gold); padding: 0 6px; border-inline: 1px dashed var(--line); }
.goal .led { font-size: 64px; color: var(--gold); text-shadow: none; }
.goal small { display: block; font: 600 18px/1.2 var(--font-body); letter-spacing: .14em; text-transform: uppercase; margin-top: 6px; }
.verdict { margin-top: 34px; font: 600 40px/1.15 var(--font-body); }
.verdict b { color: var(--cr7-led); font-weight: 700; }
svg { display: block; margin-top: 18px; }
.foot { margin-top: auto; display: flex; justify-content: space-between; align-items: baseline; gap: 24px; font: 500 22px/1.3 var(--font-body); color: var(--muted); }
.foot .url { color: var(--fg); font-weight: 700; font-size: 26px; white-space: nowrap; }
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow" id="eyebrow">Simulação Monte Carlo</div>
  <h1>Corrida ao gol <span class="k">1000</span></h1>
  <div class="board">
    <div><div class="who"><span class="sq" style="background:var(--messi)"></span>Messi</div><div class="need" id="needM"></div></div>
    <div class="led m" id="ledM"></div>
    <div class="goal"><div class="led">1000</div><small>gols oficiais</small></div>
    <div class="led c" id="ledC"></div>
    <div class="r"><div class="who r">Cristiano Ronaldo<span class="sq" style="background:var(--cr7)"></span></div><div class="need" id="needC"></div></div>
  </div>
  <div class="verdict" id="verdict"></div>
  <svg id="faixa" width="1456" height="262" role="img" aria-label="Quando sai o milésimo de cada um"></svg>
  <div class="foot">
    <span id="fonte"></span>
    <span class="url">matheusgsd.github.io/messi-cr7-1000</span>
  </div>
</div>
<script src="../data/data.js"></script>
<script src="../sim.js"></script>
<script>
/* Mesma conta da página: recorte ponderado ótimo, 10.000 simulações, semente 20261010. */
(function () {
  const D = window.DATA, S = window.Sim, KEYS = ['messi', 'cr7'], N = 10000, SEED = 20261010;
  const P = KEYS.map((k) => D.players[k]);
  const MES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  const ym = (day) => { const d = new Date(day * 86400000); return [d.getUTCFullYear(), d.getUTCMonth()]; };
  const mesAno = (day) => { const [y, m] = ym(day); return `${MES[m]}/${y}`; };
  const br = (iso) => `${iso.slice(8, 10)}/${iso.slice(5, 7)}/${iso.slice(0, 4)}`;
  const int = (x) => x.toLocaleString('pt-BR');
  const pct = (x) => (100 * x).toLocaleString('pt-BR', { maximumFractionDigits: 1 });

  const w = D.windows.find((x) => x.id === 'ponderado');
  const wp = KEYS.map((_, pi) => S.windowParams(P[pi].club_matches, { kind: 'decay', halfLife: w.halfLife }, D.asOf, D.prior));
  const players = KEYS.map((k, pi) => ({ key: k, need: 1000 - P[pi].total, mult: 1, a: wp[pi].a, b: wp[pi].b,
    fx: Int32Array.from(P[pi].fixtures.map((f) => S.dayNum(f[0]))) }));
  const run = S.createRun({ nSims: N, seed: SEED, players, months: [S.dayNum(D.asOf)], quantileSims: 0, drawSims: 0 });
  S.step(run, N);
  const s = S.summarize(run);

  document.getElementById('eyebrow').textContent = `Simulação Monte Carlo · dados até ${br(D.asOf)}`;
  document.getElementById('ledM').textContent = P[0].total;
  document.getElementById('ledC').textContent = P[1].total;
  document.getElementById('needM').innerHTML = `faltam <b>${1000 - P[0].total}</b> · ${P[0].club}`;
  document.getElementById('needC').innerHTML = `${P[1].club} · faltam <b>${1000 - P[1].total}</b>`;
  const lead = s.first[1] >= s.first[0] ? 1 : 0, nLead = Math.round(s.first[lead] * N);
  const quem = lead ? 'Cristiano Ronaldo' : 'Messi';
  document.getElementById('verdict').innerHTML = nLead === N
    ? `Em todas as ${int(N)} simulações, <b>${quem}</b> chega primeiro.`
    : `<b>${quem}</b> chega primeiro em ${pct(s.first[lead])}% das ${int(N)} simulações.`;
  document.getElementById('fonte').textContent =
    `Ritmo de gols pelo clube e jogos reais do calendário. Gols: messivsronaldo.app. Por Matheus Dalmolin.`;

  // faixa do tempo: 80% das simulações (p10–p90) e a mediana de cada um
  const svg = document.getElementById('faixa'), NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; svg.appendChild(e); return e; };
  const W = 1456, L = 0, R = 1456;
  const [y0] = ym(S.dayNum(D.asOf));
  const yEnd = Math.max(...s.per.map((p) => ym(p.p90)[0])) + 1;
  const t0 = S.dayNum(D.asOf), t1 = S.dayNum(`${yEnd}-01-01`);
  const x = (day) => L + (R - L) * (day - t0) / (t1 - t0);
  const AX = 226;
  el('line', { x1: L, x2: R, y1: AX, y2: AX, stroke: '#24324d', 'stroke-width': 2 });
  for (let y = y0 + 1; y <= yEnd; y++) {
    const xx = x(S.dayNum(`${y}-01-01`));
    el('line', { x1: xx, x2: xx, y1: 8, y2: AX, stroke: '#1c2840', 'stroke-width': 2 });
    el('text', { x: xx, y: AX + 0, dy: 26, 'text-anchor': y === yEnd ? 'end' : 'middle', fill: '#8f9cb4', 'font-family': 'Barlow', 'font-size': 22, 'font-weight': 600 }, y);
  }
  el('text', { x: 0, y: AX, dy: 26, fill: '#8f9cb4', 'font-family': 'Barlow', 'font-size': 22, 'font-weight': 600 }, 'hoje');
  const rows = [[1, 52, 'var(--cr7)', '#ff6d68'], [0, 150, 'var(--messi)', '#82c3f6']];
  for (const [pi, cy, cor, led] of rows) {
    const p = s.per[pi];
    el('rect', { x: x(p.p10), y: cy - 20, width: Math.max(8, x(p.p90) - x(p.p10)), height: 40, rx: 20, fill: cor, opacity: 0.35 });
    el('circle', { cx: x(p.p50), cy, r: 16, fill: led, stroke: '#0b111c', 'stroke-width': 4 });
    const nome = pi ? 'CR7' : 'Messi';
    const lbl = `${nome}: ${mesAno(p.p50)}`;
    const right = x(p.p90) + 22, roomRight = right + 420 < W;
    el('text', { x: roomRight ? right : x(p.p10) - 22, y: cy, dy: 12, 'text-anchor': roomRight ? 'start' : 'end', fill: '#e9eef6', 'font-family': 'Big Shoulders Display', 'font-size': 42, 'font-weight': 800, stroke: '#0b111c', 'stroke-width': 10, 'paint-order': 'stroke' }, lbl.toUpperCase());
    el('text', { x: roomRight ? right : x(p.p10) - 22, y: cy, dy: 44, 'text-anchor': roomRight ? 'start' : 'end', fill: '#8f9cb4', 'font-family': 'Barlow', 'font-size': 22, 'font-weight': 500, stroke: '#0b111c', 'stroke-width': 8, 'paint-order': 'stroke' },
      `80% das simulações entre ${mesAno(p.p10)} e ${mesAno(p.p90)}`);
  }
  document.body.dataset.pronto = '1';
})();
</script>
</body>
</html>
